<script>
/*
  Port of the Unity sigil generator into synchronous JS using SVG.js.
  Rendering is inspired by how the Unity update activated connectors/corners/U/O per cell.
  This is an approximation intended for SVG export and experimentation.
*/

// ---- Utilities ----
// Simple hash function for strings
function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash; // Convert to 32-bit integer
  }
  return Math.abs(hash);
}

// Seeded random number generator (Linear Congruential Generator)
class SeededRandom {
  constructor(seed) {
    this.seed = seed % 2147483647;
    if (this.seed <= 0) this.seed += 2147483646;
  }
  
  next() {
    this.seed = this.seed * 16807 % 2147483647;
    return this.seed;
  }
  
  nextFloat() {
    return (this.next() - 1) / 2147483646;
  }
}

let rng = new SeededRandom(Date.now()); // Default seed

function randInt(min, maxInclusive) {
  return Math.floor(rng.nextFloat() * (maxInclusive - min + 1)) + min;
}
function randFloat() { return rng.nextFloat(); }
function hsvToRgbString(h, s, v) {
  // returns rgb() string
  let r, g, b;
  let i = Math.floor(h * 6);
  let f = h * 6 - i;
  let p = v * (1 - s);
  let q = v * (1 - f * s);
  let t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r=v; g=t; b=p; break;
    case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=t; break;
    case 3: r=p; g=q; b=v; break;
    case 4: r=t; g=p; b=v; break;
    case 5: r=v; g=p; b=q; break;
  }
  const to255 = x => Math.round(x*255);
  return `rgb(${to255(r)},${to255(g)},${to255(b)})`;
}

// ---- Name Generation ----
const vowels = ['A', 'E', 'I', 'O', 'U', 'Y'];
const consonants = [
  'B', 'C', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M',
  'N', 'P', 'Q', 'R', 'S', 'T', 'V', 'W', 'X', 'Z'
];

let currentSigilName = '';

function generateSigilName() {
  // Generate a random name with alternating consonants and vowels, length 4-8
  // This uses Math.random() directly so it's not deterministic
  let name = '';
  let length = Math.floor(Math.random() * 5) + 4; // 4-8
  let useVowel = Math.random() > 0.5;
  for (let i = 0; i < length; i++) {
    if (useVowel) {
      name += vowels[Math.floor(Math.random() * vowels.length)];
    } else {
      name += consonants[Math.floor(Math.random() * consonants.length)];
    }
    if (!useVowel) {
      useVowel = true;
    }
    else {
      useVowel = Math.random() > 0.7;
    }
  }
  return name;
}

// ---- Generator/Renderer ----
const minSigilSize = 4;
const maxSigilSize = 7;

let draw = null;
let sigilSize = 5;
const outerPadding = 128; // px padding around whole sigil

function clearCanvas() {
  if (draw) {
    document.getElementById('canvas').innerHTML = '';
    draw = null;
  }
}

function getIndex(position, size = 0) {
  if (size <= 0) size = sigilSize;
  return Math.floor(position.y) * size + Math.floor(position.x);
}
function getPosition(index, size = 0) {
  if (size <= 0) size = sigilSize;
  return { x: index % size, y: Math.floor(index / size) };
}
function getNeighbours(positionObj) {
  const neighbours = [];
  const x = positionObj.x, y = positionObj.y;
  if (x > 0) neighbours.push(getIndex({x:x-1,y:y}));
  if (x < sigilSize-1) neighbours.push(getIndex({x:x+1,y:y}));
  if (y > 0) neighbours.push(getIndex({x:x,y:y-1}));
  if (y < sigilSize-1) neighbours.push(getIndex({x:x,y:y+1}));
  return neighbours;
}

function generateSigil() {
  // Get the name from input field, or generate random name if empty
  const inputName = document.getElementById('nameInput').value.trim().toUpperCase();
  if (inputName) {
    currentSigilName = inputName;
  } else {
    currentSigilName = generateSigilName();
    // Update the input field with the generated name
    document.getElementById('nameInput').value = currentSigilName;
  }
  
  // Create a deterministic seed from the name
  const seed = hashString(currentSigilName);
  rng = new SeededRandom(seed);
  
  // Now all random generation will be deterministic based on the name
  
  // pick size
  sigilSize = randInt(minSigilSize, maxSigilSize);
  let cellSize = Math.round(450 / sigilSize); // Cell size varies based on sigil complexity
  if (cellSize % 2 == 1) cellSize += 1
  // console.log("cellSize: ", cellSize)
  
  // Fixed canvas dimensions regardless of sigil size
  const canvasSize = 450;
  const w = canvasSize;
  const h = canvasSize;

  // initialize svg.js drawing surface
  clearCanvas();
  draw = SVG().addTo('#canvas').size(w + outerPadding*2, h + outerPadding*2);
  draw.viewbox(0,0,w + outerPadding*2, h + outerPadding*2);

  const isGrayscale = randFloat() < 0.05

  // background
  let bgColor = hsvToRgbString(randFloat(), randFloat(), randFloat());
  if (isGrayscale) {
    const gray = Math.round(randFloat() * 255);
    bgColor = `rgb(${gray},${gray},${gray})`;
  }
  draw.rect(w + outerPadding*2, h + outerPadding*2).fill(bgColor).move(0,0);

  // Set the page background to match the sigil background
  // document.body.style.background = bgColor;

  // Data structures (ports of Unity)
  const wallSize = (sigilSize - 1) * sigilSize;
  const horizontal = new Array(wallSize).fill(false);
  const vertical = new Array(wallSize).fill(false);
  const visited = new Array(sigilSize * sigilSize).fill(false);
  const colors = new Array(sigilSize * sigilSize).fill('black');

  const edges = [];
  const edgeOrigins = [];
  const pathIsSymmetrical = [];
  const pathColors = [];

  // choose path starts
  const pathStarts = [];
  const pathSteps = []; // not needed for rendering but we keep parity
  const pathCount = randInt(2, Math.max(2, Math.floor(sigilSize / 2)));
  for (let i = 0; i < pathCount; i++) {
    // choose startRow like Unity (0..sigilSize-i-1)
    let maxRow = Math.max(0, sigilSize - i - 1);
    let startRow = randInt(0, Math.max(0, sigilSize - i - 1));
    // ensure a start that isn't visited; mimic small loop in Unity
    let attempts = 0;
    while (attempts < sigilSize && visited[getIndex({x:(sigilSize-1)/2|0,y:startRow})]) {
      startRow = Math.min(sigilSize-1, startRow+1);
      attempts++;
    }
    const start = { x: Math.floor((sigilSize - 1) / 2), y: startRow };
    pathStarts.push(start);
    const startIndex = getIndex(start);
    visited[startIndex] = true;
    edges.push(startIndex);
    edgeOrigins.push(i);
    pathIsSymmetrical.push(randFloat() > 0.15);
    let pColor = hsvToRgbString(randFloat(), randFloat(), randFloat());
    if (isGrayscale) {
      const gray = Math.round(randFloat() * 255);
      pColor = `rgb(${gray},${gray},${gray})`;
    }
    pathColors.push(pColor);
    colors[startIndex] = pColor;

    if (sigilSize % 2 === 0) {
      // mirror start
      const mirrorStart = { x: start.x + 1, y: startRow };
      const mirrorIndex = getIndex(mirrorStart);
      visited[mirrorIndex] = true;
      edges.push(mirrorIndex);
      edgeOrigins.push(i);
      colors[mirrorIndex] = pColor;
      if (randFloat() > 0.5) {
        const wallIndex = Math.min(getIndex(start), mirrorIndex);
        const wallPos = getPosition(wallIndex);
        const hIndex = getIndex(wallPos, sigilSize - 1);
        horizontal[hIndex] = true;
      }
    }
  }

  // main expansion loop (synchronous)
  while (edges.length > 0) {
    // pick a random edge that has unvisited neighbours
    let chosenEdgeIndex = -1;
    let unvisitedNeighbours = [];
    let chosenEdgeOrigin = 0;
    let currentIndex = 0;
    for (let attempts=0; attempts<edges.length; attempts++) {
      const ei = randInt(0, edges.length-1);
      currentIndex = edges[ei];
      chosenEdgeOrigin = edgeOrigins[ei];
      const currentPos = getPosition(currentIndex);
      const neighbours = getNeighbours(currentPos);
      unvisitedNeighbours = neighbours.filter(n => !visited[n]);
      if (unvisitedNeighbours.length === 0) {
        // remove edge (like Unity)
        edges.splice(ei,1);
        edgeOrigins.splice(ei,1);
        continue;
      } else {
        chosenEdgeIndex = ei;
        break;
      }
    }
    if (chosenEdgeIndex === -1) break; // no expandible edge

    // pick random neighbour
    const neighbourIndex = unvisitedNeighbours[randInt(0, unvisitedNeighbours.length-1)];
    const neighbour = getPosition(neighbourIndex);
    const current = getPosition(currentIndex);

    // determine wall index and set horizontal/vertical per unity
    let wallIndex = Math.min(currentIndex, neighbourIndex);
    const wallPos = getPosition(wallIndex);
    if (neighbour.x === current.x) {
      // vertical wall (same column; neighbour above/below)
      // walls indexed into vertical array by position
      const vIndex = getIndex(wallPos);
      vertical[vIndex] = true;
    } else {
      // horizontal wall (neighbour left/right)
      const hIndex = getIndex(wallPos, sigilSize - 1);
      horizontal[hIndex] = true;
    }

    // visit neighbour
    visited[neighbourIndex] = true;
    edges.push(neighbourIndex);
    edgeOrigins.push(chosenEdgeOrigin);
    colors[neighbourIndex] = pathColors[chosenEdgeOrigin];

    // record step (kept for parity; not used later)
    pathSteps.push({ origin: chosenEdgeOrigin, coordinates: neighbour });

    // symmetry handling
    if (pathIsSymmetrical[chosenEdgeOrigin]) {
      const mirrorNeighbor = { x: (sigilSize - 1) - neighbour.x, y: neighbour.y };
      const mirrorNeighborIndex = getIndex(mirrorNeighbor);
      const mirrorCurrent = { x: (sigilSize - 1) - current.x, y: current.y };
      const mirrorCurrentIndex = getIndex(mirrorCurrent);
      const mirrorEdgeIndex = edges.indexOf(mirrorCurrentIndex);
      const mirrorEdgeOrigin = mirrorEdgeIndex >= 0 ? edgeOrigins[mirrorEdgeIndex] : -1;

      if ((!visited[mirrorNeighborIndex] || (sigilSize % 2 === 1 && mirrorNeighbor.x === Math.floor((sigilSize-1)/2))) &&
          mirrorEdgeOrigin === chosenEdgeOrigin) {
        const mirrorWallIndex = Math.min(mirrorNeighborIndex, getIndex(mirrorCurrent));
        const mirrorWallPos = getPosition(mirrorWallIndex);
        if (neighbour.x === current.x) {
          // vertical
          vertical[getIndex(mirrorWallPos)] = true;
        } else {
          horizontal[getIndex(mirrorWallPos, sigilSize - 1)] = true;
        }
        visited[mirrorNeighborIndex] = true;
        edges.push(mirrorNeighborIndex);
        edgeOrigins.push(chosenEdgeOrigin);
        colors[mirrorNeighborIndex] = pathColors[chosenEdgeOrigin];
        pathSteps.push({ origin: chosenEdgeOrigin, coordinates: mirrorNeighbor, isMirror: true });
      }
    }
  }

  // ---- Rendering ----
  const group = draw.group().move(outerPadding, outerPadding);

  // // draw base black field for 'cells' so rounded shapes overlay nicely
  // group.rect(w, h).fill('#0b0607').move(0,0).radius(8);

  // For each cell: draw the main rounded filled rect if visited; then connectors, corners, U's, O's
  let rectSize = Math.round(cellSize * 0.9)
  if (rectSize % 2 == 1) rectSize += 1
  // console.log("rectSize: ", rectSize)
  // const connectorWidth = Math.max(4, Math.round(cellSize * 0.18));
  const connectorWidth = rectSize;
  const connectorLen = cellSize;
  const cornerSize = Math.round(cellSize * 0.1);
  const uThickness = connectorWidth;
  const cellRadius = Math.round(cellSize * 0.1);

  for (let i = 0; i < sigilSize * sigilSize; i++) {
    const pos = getPosition(i);
    const px = pos.x * cellSize + outerPadding + (cellSize - rectSize) * 0.5;
    const py = (sigilSize-1 - pos.y) * cellSize + outerPadding; // flip Y to render row 0 at top (unity Y up)
    // Note: Unity used localPosition with y increasing up; in canvas y goes down so invert Y:
    // We want visual parity but orientation doesn't need to be exact to the user image.

    // Draw visited cell as rounded rect
    const fillColor = visited[i] ? colors[i] : 'black';
    if (visited[i]) {
      group.rect(rectSize, rectSize).move(px, py).fill(fillColor).radius(cellRadius);
    }

    // compute connector booleans similar to Unity Update
    const hIndex = getIndex({x:pos.x, y:pos.y}, sigilSize - 1);
    const rightConnector = pos.x < sigilSize - 1 && horizontal[hIndex];
    const belowIndex = getIndex({x:pos.x, y:pos.y-1});
    const bottomConnector = pos.y > 0 && vertical[belowIndex];
    const leftHIndex = getIndex({x:pos.x-1, y:pos.y}, sigilSize - 1);
    const leftConnector = pos.x > 0 && horizontal[leftHIndex];
    const topConnector = pos.y < sigilSize - 1 && vertical[i];

    // draw connectors as rounded rectangles bridging cell centers
    const centerX = px + rectSize/2;
    const centerY = py + rectSize/2;
    if (rightConnector) {
      group.rect(cellSize, connectorWidth).move(centerX, centerY - connectorWidth/2).fill(fillColor);
    }
    if (leftConnector) {
      group.rect(cellSize, connectorWidth).move(centerX - cellSize, centerY - connectorWidth/2).fill(fillColor);
    }
    if (topConnector) {
      group.rect(connectorWidth, cellSize).move(centerX - connectorWidth/2, centerY - cellSize).fill(fillColor);
    }
    if (bottomConnector) {
      group.rect(connectorWidth, rectSize/2).move(centerX - connectorWidth/2, centerY).fill(fillColor);
    }

    let gap = cellSize - rectSize
    let uPath = `
      M 0 0
      H ${gap} V ${gap} H 0
      Z
      M 0 0
      A ${(gap) / 2} ${(gap) / 2} 0 0 0 ${gap} 0
      Z
    `
    // compute corner and U / O logic per original Update
    // downLeftU / rightUpU / rightDownU / leftUpU variables:
    let leftDownU = false;
    if (pos.x > 0 && pos.y > 0) {
      const indexHLeftBelow = getIndex({x:pos.x-1, y:pos.y-1}, sigilSize-1);
      const indexVLeftBelow = getIndex({x:pos.x-1, y:pos.y-1});
      const condO = leftConnector && bottomConnector && horizontal[indexHLeftBelow] && vertical[indexVLeftBelow];
      // Left U
      if (leftConnector && bottomConnector && horizontal[indexHLeftBelow]) {
        leftDownU = true;
        group.path(uPath).transform({rotate: -90, translateX: px - gap, translateY: py + rectSize}).fill(fillColor)
      }
      // Down U
      if (leftConnector && bottomConnector && vertical[indexVLeftBelow]) {
        leftDownU = true;
        group.path(uPath).transform({rotate: 180, translateX: px - gap, translateY: py + rectSize}).fill(fillColor)
      }
    }

    let rightUpU = false;
    if (pos.x < sigilSize - 1 && pos.y < sigilSize - 1) {
      const indexHAbove = getIndex({x:pos.x, y:pos.y+1}, sigilSize-1);
      const indexVRight = getIndex({x:pos.x+1, y:pos.y});
      // Right U
      if (rightConnector && topConnector && horizontal[indexHAbove]) {
        rightUpU = true;
        group.path(uPath).transform({rotate: 90, translateX: px + rectSize, translateY: py - gap}).fill(fillColor)
      }
      // Up U
      if (rightConnector && topConnector && vertical[indexVRight]) {
        rightUpU = true;
        group.path(uPath).transform({rotate: 0, translateX: px + rectSize, translateY: py - gap}).fill(fillColor)
      }
    }

    let rightDownU = false;
    if (pos.x < sigilSize - 1 && pos.y > 0) {
      const indexVRightBelow = getIndex({x:pos.x+1, y:pos.y-1});
      const indexHBelow = getIndex({x:pos.x, y:pos.y-1}, sigilSize-1);
      rightDownU = (rightConnector && bottomConnector && vertical[indexVRightBelow]) || (rightConnector && bottomConnector && horizontal[indexHBelow]);
    }

    let leftUpU = false;
    if (pos.x > 0 && pos.y < sigilSize - 1) {
      const indexVLeft = getIndex({x:pos.x-1, y:pos.y});
      const indexHLeftAbove = getIndex({x:pos.x-1, y:pos.y+1}, sigilSize-1);
      leftUpU = (leftConnector && topConnector && indexVLeft !== undefined && vertical[indexVLeft]) || (leftConnector && topConnector && horizontal[indexHLeftAbove]);
    }

    let cutIn = cellSize / 2 + (cellSize - rectSize) / 2
    let r = cellSize * 0.15

    let roundedCutout = `
      M 0 0
      H ${cutIn}
      V ${cutIn - r}
      A ${r} ${r} 0 0 1 ${cutIn - r} ${cutIn}
      H 0
      Z
    `
    let cornerShape = `
      M 0 0
      H ${cellSize}
      V ${cellSize}
      H 0
      Z
      ${roundedCutout}
    `
    // .transform({translateX: centerX, translateY: centerY})
    // .fill('black')
    // .attr({ 'fill-rule': 'evenodd' })

    // corners
    const cornerTL = !leftUpU && (pos.x > 0 && pos.y < sigilSize - 1 && leftConnector && topConnector);
    const cornerTR = !rightUpU && (pos.x < sigilSize - 1 && pos.y < sigilSize - 1 && topConnector && rightConnector);
    const cornerBR = !rightDownU && (pos.x < sigilSize - 1 && pos.y > 0 && bottomConnector && rightConnector);
    const cornerBL = !leftDownU && (pos.x > 0 && pos.y > 0 && leftConnector && bottomConnector);

    const cornerColor = '#13060a';
    if (cornerTL) group.path(cornerShape).transform({translateX:centerX - cellSize, translateY: centerY - cellSize}).fill(fillColor).attr({'fill-rule': 'evenodd'})
    if (cornerTR) group.path(cornerShape).transform({translateX:centerX, translateY: centerY - cellSize, rotate: 90}).fill(fillColor).attr({'fill-rule': 'evenodd'})
    if (cornerBR) group.path(cornerShape).transform({translateX:centerX, translateY: centerY, rotate: 180}).fill(fillColor).attr({'fill-rule': 'evenodd'})
    if (cornerBL) group.path(cornerShape).transform({translateX:centerX - cellSize, translateY: centerY, rotate: 270}).fill(fillColor).attr({'fill-rule': 'evenodd'})
  }

  // put a subtle outer stroke around the whole sigil
  // group.rect(w, h).move(0,0).fill('none').stroke({ width: Math.max(2, Math.round(cellSize*0.03)), color: '#0f0b0d' }).radius(8);

  // store svg element for download
  return draw;
}

  document.getElementById('canvas').style.display = 'block';

document.getElementById('nameInput').addEventListener('keypress', (event) => {

    document.getElementById('generateBtn').click();

});

// Convert input to uppercase in real-time
document.getElementById('nameInput').addEventListener('input', (event) => {
  const input = event.target;
  const cursorPosition = input.selectionStart;
  input.value = input.value.toUpperCase();
  input.setSelectionRange(cursorPosition, cursorPosition);
});

// Restart functionality - restore all controls
document.getElementById('restartBtn').addEventListener('click', () => {
  // Hide the sigil title
  document.getElementById('sigilTitle').style.visibility = 'hidden';
  document.getElementById('sigilTitle').innerHTML = '&nbsp;';
  
  document.getElementById('nameInput').style.display = 'block';
  
  // Reset button states
  document.getElementById('summonBtn').style.display = 'inline-block';
  document.getElementById('generateBtn').style.display = 'block';
  document.getElementById('savePngBtn').style.display = 'block';
  document.getElementById('downloadControls').style.display = 'block';
  document.getElementById('restartControls').style.display = 'none';
});

document.getElementById('savePngBtn').addEventListener('click', () => {
  // Show the sigil title
  const titleElement = document.getElementById('sigilTitle');
  titleElement.textContent = currentSigilName;
  titleElement.style.color = 'white';
  titleElement.style.visibility = 'visible';
  
  const svgElement = document.querySelector('#canvas svg');
  if (!svgElement) {
    console.error('SVG element not found! Canvas contents:', document.getElementById('canvas').innerHTML);
    alert('Error: Sigil not found. Please generate a sigil first.');
    return;
  }
  
  console.log('SVG element found:', svgElement);
  
  // Get SVG dimensions
  const svgRect = svgElement.getBoundingClientRect();
  const svgWidth = svgElement.viewBox.baseVal.width || svgRect.width;
  const svgHeight = svgElement.viewBox.baseVal.height || svgRect.height;
  
  console.log('SVG dimensions:', svgWidth, 'x', svgHeight);
  
  // Create canvas
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = svgWidth;
  canvas.height = svgHeight;
  
  // Serialize SVG
  const serializer = new XMLSerializer();
  let source = serializer.serializeToString(svgElement);
  
  // Add XML declaration if missing
  if(!source.match(/^<\?xml/)) {
    source = '<?xml version="1.0" standalone="no"?>\n' + source;
  }
  
  // Create blob and object URL for the SVG
  const svgBlob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
  const svgUrl = URL.createObjectURL(svgBlob);
  
  // Create image and draw to canvas
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0);
    
    // Convert canvas to PNG and download
    canvas.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${currentSigilName}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      // Hide the input field and buttons after sealing the sigil
      document.getElementById('nameInput').style.display = 'none';
      document.getElementById('summonBtn').style.display = 'none';
      document.getElementById('generateBtn').style.display = 'none';
      document.getElementById('savePngBtn').style.display = 'none';
      
      // Show the restart button
      document.getElementById('restartControls').style.display = 'block';
    }, 'image/png');
    
    URL.revokeObjectURL(svgUrl);
  };
  img.src = svgUrl;
});
